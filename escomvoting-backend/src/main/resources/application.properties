spring.application.name=escomvoting
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${APP_DB_URL}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiry-ms=86400000

# Crypto — AES-256 key for encrypting election EC private keys at rest
app.crypto.election-key-secret=${APP_CRYPTO_ELECTION_KEY_SECRET}

# Server
server.port=8080

# CORS — frontend dev port
app.cors.allowed-origins=http://localhost:44100

# Bootstrap admin user (created if missing)
app.admin.institutional-id=ADMIN-0001
app.admin.email=admin@escom.ipn.mx
app.admin.name=Administrador Sistema
app.admin.password=Admin1234!

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: escomvoting
      POSTGRES_USER: escom
      POSTGRES_PASSWORD: escom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escom -d escomvoting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
